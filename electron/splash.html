<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Eryon Launcher</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: #0b0b0d;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;

      width: 100%;
      height: 100%;
    }

    .splash-logo {
      width: 200px;
      height: 200px;

      animation: latido 1.6s ease-in-out infinite;
    }

    @keyframes latido {
      0%,
      100% {
        transform: scale(1);

        opacity: 0.9;
      }

      50% {
        transform: scale(1.06);

        opacity: 1;
      }
    }

    .splash-barra {
      width: 160px;
      height: 3px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.08);

      overflow: hidden;
    }

    .splash-barra span {
      display: block;

      width: 45%;
      height: 100%;

      border-radius: 999px;

      background: #55d66b;

      animation: cargando 1.1s ease-in-out infinite;
    }

    @keyframes cargando {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(345%);
      }
    }

    .splash-texto {
      color: #6f8377;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="splash">
    <img class="splash-logo" src="../build/logo-splash.png" alt="Eryon" />
    <div class="splash-barra"><span></span></div>
    <span class="splash-texto">Cargando Eryon</span>
  </div>
</body>
</html>
