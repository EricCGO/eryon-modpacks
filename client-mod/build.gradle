plugins {
    id "fabric-loom" version "1.6.12"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mixin {
        defaultRefmapName = "eryon-identity-client-1.20.1-refmap.json"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.register("copyLauncherMod", Copy) {
    dependsOn tasks.remapJar
    from(tasks.remapJar.archiveFile)
    into(new File(rootProject.projectDir.parentFile, "build"))
    rename { "eryon-identity-client-1.20.1.jar" }
}

tasks.register("deleteLegacyBadgeJar", Delete) {
    delete new File(rootProject.projectDir.parentFile, "build/eryon-badge-fabric-1.20.1.jar")
}

tasks.build {
    finalizedBy tasks.copyLauncherMod
    finalizedBy tasks.deleteLegacyBadgeJar
}
