plugins {
    id "fabric-loom" version "1.9.2"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mixin {
        defaultRefmapName = "eryon-menu-helper-refmap.json"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // solo para compilar el mixin contra la clase real del mod (no se empaqueta)
    compileOnly files("C:/Users/lenov/AppData/Roaming/eryon-launcher/eryon-instances/test/mods-reviil-origen/SobreviveReviilByNavithLabs-1.0.1-1.21.1.jar.orig")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.register("copyToTest", Copy) {
    dependsOn tasks.remapJar
    from(tasks.remapJar.archiveFile)
    into("C:/Users/lenov/AppData/Roaming/eryon-launcher/eryon-instances/test/mods")
}
tasks.build {
    finalizedBy tasks.copyToTest
}
